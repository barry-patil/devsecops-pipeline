sonar.projectKey=pratik-app
sonar.projectName=Pratik App
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml

sonar.qualitygate.wait=true

# Fail the build if coverage drops below 80%
sonar.coverage.exclusions=**/tests/**,**/migrations/**

# These are noisy in early-stage projects; revisit before going to production
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S106
sonar.issue.ignore.multicriteria.e1.resourceKey=**/tests/**
